name: Format change
description: retro printed "format drift" for an agent.
labels: ["format-change"]
body:
  - type: markdown
    attributes:
      value: |
        Run `goldfished shapes --agent <agent>` and paste its output below. It holds counts only.
        Do not paste session text, paths or names anywhere in this form.
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: claude-code
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: The agent's version
    validations:
      required: true
  - type: textarea
    id: shapes
    attributes:
      label: The goldfished shapes output
      render: text
    validations:
      required: true
  - type: checkboxes
    id: clean
    attributes:
      label: Privacy
      options:
        - label: I have pasted no session text, paths or names
          required: true
